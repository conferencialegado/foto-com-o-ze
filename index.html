<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Foto com o Zé · Sinos Service</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#070d26; color:#fff; font-family:Poppins,system-ui,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; gap:8px; padding:8px 0 12px; }
  .stage { position:relative; height:calc(100dvh - 160px); max-width:100vw; aspect-ratio:9/16; border-radius:18px; overflow:hidden;
           background:linear-gradient(180deg,#26357a,#121a45); touch-action:none; user-select:none; -webkit-user-select:none; }
  .layer { position:absolute; inset:0; width:100%; height:100%; }
  video.layer, canvas.layer { object-fit:cover; }
  video.mirror { transform:scaleX(-1); }
  #ze { position:absolute; left:0; top:0; transform-origin:0 0; pointer-events:none; filter:drop-shadow(-6px 8px 10px rgba(0,0,0,.35)); }
  #static { pointer-events:none; }
  #result { -webkit-touch-callout:default; user-select:auto; -webkit-user-select:auto; touch-action:auto; z-index:5; object-fit:cover; }
  .flash { background:#fff; opacity:0; pointer-events:none; transition:opacity .2s; }
  .hidden { display:none !important; }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; min-height:44px; }
  .bar { min-height:64px; }
  button, label.btn { font:inherit; font-weight:700; font-size:15px; border:0; border-radius:999px; padding:13px 20px; color:#fff; cursor:pointer;
                  background:rgba(255,255,255,.12); display:inline-flex; align-items:center; gap:7px; }
  .main { background:linear-gradient(135deg,#2a5bff,#34aaff); }
  .shutter { width:64px; height:64px; padding:0; border-radius:50%; background:#fff; border:5px solid #34aaff; }
  .round { width:48px; height:48px; padding:0; justify-content:center; font-size:19px; }
  .chip { display:flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; }
  .chip button { padding:7px 13px; font-size:12.5px; background:transparent; }
  .chip button.on { background:#1634a8; }
  .size { display:flex; align-items:center; gap:8px; font-size:12px; color:#cdd8ff; width:min(92vw,420px); }
  .size input { flex:1; accent-color:#34aaff; }
  input[type=file] { display:none; }
  .tip { position:absolute; left:0; right:0; top:10px; text-align:center; font-size:12px; color:#fff; text-shadow:0 1px 4px #000; pointer-events:none; z-index:6; }
  .sheet { position:fixed; inset:0; background:rgba(4,8,30,.85); display:flex; align-items:center; justify-content:center; z-index:20; padding:24px; }
  .sheet div { background:#16204f; border-radius:18px; padding:20px; max-width:340px; text-align:center; font-size:14px; line-height:1.5; }
  .sheet b { color:#7fc8ff; }
  .sheet button { margin-top:14px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="video" class="layer hidden" playsinline muted autoplay></video>
  <canvas id="photo" class="layer hidden" width="1080" height="1920"></canvas>
  <img id="ze" alt="Zé">
  <img id="static" class="layer" alt="">
  <img id="result" class="layer hidden" alt="Sua foto com o Zé">
  <div class="tip" id="tip">Arraste o Zé para posicionar</div>
  <div class="flash layer" id="flash"></div>
</div>

<div class="row" id="opts">
  <div class="chip" id="frameChip">
    <button data-f="ze" class="on">Sem moldura</button>
    <button data-f="moldura">Com moldura</button>
  </div>
  <div class="chip hidden" id="moveChip">
    <button data-m="ze" class="on">Mover Zé</button>
    <button data-m="foto">Mover foto</button>
  </div>
</div>
<div class="size" id="sizeRow">Tamanho do Zé <input type="range" id="size" min="0.45" max="1.3" step="0.01" value="1"></div>

<div class="row bar" id="barStart">
  <button class="main" id="btnCam">📷 Tirar foto</button>
  <label class="btn" for="pick">🖼️ Escolher foto</label>
  <input type="file" id="pick" accept="image/*">
  <input type="file" id="camNative" accept="image/*" capture="user">
</div>
<div class="row bar hidden" id="barCam">
  <button class="round" id="btnBack" aria-label="Fechar">✕</button>
  <button class="shutter" id="btnShoot" aria-label="Tirar foto"></button>
  <button class="round" id="btnFlip" aria-label="Virar câmera">🔄</button>
</div>
<div class="row bar hidden" id="barAdjust">
  <button id="btnBack2">✕</button>
  <button class="main" id="btnOk">✔ Pronto</button>
</div>
<div class="row bar hidden" id="barResult">
  <button class="main" id="btnSave">⬇️ Salvar na galeria</button>
  <button id="btnShare">📲 Postar</button>
  <button class="round" id="btnAgain" aria-label="Tirar outra">↺</button>
</div>

<div class="sheet hidden" id="sheet"><div>
  <p>Para salvar na galeria:<br><b>segure o dedo em cima da foto</b> e toque em <b>“Salvar na galeria”</b> ou <b>“Adicionar às Fotos”</b>.</p>
  <button class="main" id="sheetOk">Entendi</button>
</div></div>

let stream = null, facing = "user", img = null, zoom = 1, pan = { x: 0, y: 0 }, blob = null, dataUrl = null, phase = "start";
let blocked = false; try { blocked = window.self !== window.top; } catch (_) { blocked = true; }

stEl.src = STATIC.ze;
function zeRect() { const w = ZE_W0 * zs.s, h = w * zeImg.naturalHeight / zeImg.naturalWidth; return { x: zs.cx - w / 2, y: zs.y, w, h }; }
function placeZe() {
  if (!zeImg.naturalWidth) return;
  const k = stage.clientWidth / W, r = zeRect();
  zeEl.style.width = r.w + "px";
  zeEl.style.transform = `scale(${k}) translate(${r.x}px, ${r.y}px)`;
  zeEl.style.width = r.w + "px"; zeEl.style.height = r.h + "px";
}
zeImg.onload = placeZe; addEventListener("resize", placeZe);

$("frameChip").onclick = e => { const b = e.target.closest("button"); if (!b) return; frame = b.dataset.f; stEl.src = STATIC[frame];
  [...$("frameChip").children].forEach(x => x.classList.toggle("on", x === b)); };
$("moveChip").onclick = e => { const b = e.target.closest("button"); if (!b) return; move = b.dataset.m;
  [...$("moveChip").children].forEach(x => x.classList.toggle("on", x === b));
  $("tip").textContent = move === "ze" ? "Arraste o Zé para posicionar" : "Arraste a foto e use dois dedos para zoom"; };
$("size").oninput = e => { zs.s = +e.target.value; placeZe(); };

function view(p, layer) {
  phase = p;
  ["barStart", "barCam", "barAdjust", "barResult"].forEach(b => $(b).classList.toggle("hidden", b !== { start: "barStart", cam: "barCam", adjust: "barAdjust", result: "barResult" }[p]));
  video.classList.toggle("hidden", layer !== "video");
  photo.classList.toggle("hidden", layer !== "photo");
  $("result").classList.toggle("hidden", p !== "result");
  const editing = p !== "result";
  $("opts").classList.toggle("hidden", !editing); $("sizeRow").classList.toggle("hidden", !editing);
  $("moveChip").classList.toggle("hidden", p !== "adjust");
  $("tip").classList.toggle("hidden", !editing);
  if (p !== "adjust") { move = "ze"; [...$("moveChip").children].forEach((x, i) => x.classList.toggle("on", i === 0)); $("tip").textContent = "Arraste o Zé para posicionar"; }
  placeZe();
}
function stop() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

// ---------- câmera ao vivo 9:16 ----------
async function openCam() {
  if (blocked || !navigator.mediaDevices?.getUserMedia) { $("camNative").click(); return; }
  try {
    stop();
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: facing, aspectRatio: { ideal: 9 / 16 }, width: { ideal: 1080 }, height: { ideal: 1920 } } });
    video.srcObject = stream; await video.play();
    video.classList.toggle("mirror", facing === "user");
    view("cam", "video");
  } catch (e) { blocked = true; $("camNative").click(); }
}
$("btnCam").onclick = openCam;
$("btnFlip").onclick = () => { facing = facing === "user" ? "environment" : "user"; openCam(); };
$("btnBack").onclick = $("btnBack2").onclick = () => { stop(); img = null; view("start", null); };

function cover(ctx, src, sw, sh, mirror, z = 1, p = { x: 0, y: 0 }) {
  const s = Math.max(W / sw, H / sh) * z, dw = sw * s, dh = sh * s, dx = (W - dw) / 2 + p.x, dy = (H - dh) / 2 + p.y;
  ctx.save(); if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, mirror ? W - dx - dw : dx, dy, dw, dh); ctx.restore();
}
$("btnShoot").onclick = () => {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  cover(c.getContext("2d"), video, video.videoWidth, video.videoHeight, facing === "user");
  $("flash").style.opacity = 1; setTimeout(() => $("flash").style.opacity = 0, 160);
  stop(); finish(c);
};

// ---------- foto escolhida / câmera do celular ----------
function load(e) {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const i = new Image();
  i.onload = () => { img = i; zoom = 1; pan = { x: 0, y: 0 }; draw(); view("adjust", "photo"); };
  i.src = URL.createObjectURL(f);
}
$("pick").onchange = load; $("camNative").onchange = load;
function draw() { const ctx = photo.getContext("2d"); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); cover(ctx, img, img.naturalWidth, img.naturalHeight, false, zoom, pan); }

// ---------- gestos: arrastar / pinça (Zé ou foto) ----------
const pts = new Map(); let g = null;
const d = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
stage.addEventListener("pointerdown", e => {
  if (phase === "result") return;
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  g = { zs: { ...zs }, zoom, pan: { ...pan }, pts: [...pts.values()].map(p => ({ ...p })) };
});
stage.addEventListener("pointermove", e => {
  if (!g || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const k = W / stage.clientWidth, a = [...pts.values()], b = g.pts;
  const pinch = a.length >= 2 && b.length >= 2 ? d(a[0], a[1]) / d(b[0], b[1]) : 1;
  const dx = (a[0].x - b[0].x) * k, dy = (a[0].y - b[0].y) * k;
  if (move === "foto" && img) {
    zoom = Math.min(4, Math.max(1, g.zoom * pinch)); pan = { x: g.pan.x + dx, y: g.pan.y + dy }; draw();
  } else {
    zs.s = Math.min(1.3, Math.max(0.45, g.zs.s * pinch)); zs.cx = g.zs.cx + dx; zs.y = g.zs.y + dy;
    $("size").value = zs.s; placeZe();
  }
});
const up = e => { pts.delete(e.pointerId); g = pts.size ? { zs: { ...zs }, zoom, pan: { ...pan }, pts: [...pts.values()].map(p => ({ ...p })) } : null; };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
$("btnOk").onclick = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(photo, 0, 0); finish(c); };

// ---------- montar foto final 1080x1920 ----------
function finish(c) {
  const ctx = c.getContext("2d"), r = zeRect();
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 28; ctx.shadowOffsetX = -10; ctx.shadowOffsetY = 14;
  ctx.drawImage(zeImg, r.x, r.y, r.w, r.h); ctx.restore();
  ctx.drawImage(stImgs[frame], 0, 0, W, H);
  dataUrl = c.toDataURL("image/jpeg", 0.92);
  $("result").src = dataUrl;
  c.toBlob(b => { blob = b; }, "image/jpeg", 0.92);
  view("result", null);
}
const file = () => new File([blob], NAME, { type: "image/jpeg" });
async function shareFile() {
  const f = file();
  if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f], text: TAGS }); return true; } catch (e) { return e.name === "AbortError"; } }
  return false;
}
// Salvar: no celular abre o menu do sistema (tem "Salvar imagem" → vai para a galeria)
$("btnSave").onclick = async () => {
  if (!blob) return;
  if (await shareFile()) return;
  try { const dl = window.claude?.use ? await window.claude.use("downloads") : null; if (dl) { await dl.save({ filename: NAME, data: blob }); } } catch (_) {}
  try { const a = document.createElement("a"); a.href = dataUrl; a.download = NAME; document.body.appendChild(a); a.click(); a.remove(); } catch (_) {}
  $("sheet").classList.remove("hidden");
};
$("btnShare").onclick = async () => {
  try { await navigator.clipboard?.writeText(TAGS); } catch (_) {}
  if (!(await shareFile())) $("sheet").classList.remove("hidden");
};
$("sheetOk").onclick = () => $("sheet").classList.add("hidden");
$("btnAgain").onclick = () => { img = null; blob = null; view("start", null); };
view("start", null);
</script>
</body>
</html>
